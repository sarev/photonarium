<body>
    <h1>AppState Test Harness</h1>
    <div class="controls">
        <button onclick="runAllTests()">Run All Tests</button>
        <button onclick="toggleApiLog()">Toggle API Log</button>
    </div>
    <div class="summary" id="summary">Click "Run All Tests" to begin</div>
    <div class="api-log" id="apiLog"></div>
    <div id="results"></div>

    <!-- Load AppState modules -->
    <script src="core.js"></script>
    <script src="view.js"></script>
    <script src="nav.js"></script>
    <script src="filter.js"></script>
    <script src="selection.js"></script>
    <script src="status.js"></script>
    <script src="search.js"></script>
    <script src="folders.js"></script>
    <script src="duplicates.js"></script>
    <script src="identity.js"></script>
    <script src="images.js"></script>
    <script src="index.js"></script>

    <script>
    'use strict';

    // =========================================================================
    // MOCK BACKEND
    // =========================================================================

    const MockBackend = {
        /** Tracks all API calls for verification */
        calls: [],

        /** Simulated latency (ms) */
        latency: 0,

        /** If set, next call will fail with this error */
        nextError: null,

        /** Response overrides by URL pattern */
        responses: new Map(),

        /**
         * Reset mock state between tests.
         */
        reset() {
            this.calls = [];
            this.nextError = null;
            this.responses.clear();
            this.latency = 0;
        },

        /**
         * Set a custom response for a URL pattern.
         */
        setResponse(urlPattern, response) {
            this.responses.set(urlPattern, response);
        },

        /**
         * Get response for a URL, checking patterns.
         */
        getResponse(method, url, data) {
            // Check for custom response
            for (const [pattern, response] of this.responses) {
                if (url.includes(pattern)) {
                    return typeof response === 'function'
                        ? response(method, url, data)
                        : response;
                }
            }
            // Default success response
            return { success: true };
        },

        /**
         * Log an API call.
         */
        log(method, url, data) {
            this.calls.push({ method, url, data, timestamp: Date.now() });
            const logEl = document.getElementById('apiLog');
            const div = document.createElement('div');
            div.innerHTML = `<span class="method">${method}</span> <span class="url">${url}</span> ${data ? JSON.stringify(data) : ''}`;
            logEl.appendChild(div);
            logEl.scrollTop = logEl.scrollHeight;
        },

        /**
         * Find calls matching criteria.
         */
        findCalls(method, urlPattern) {
            return this.calls.filter(c =>
                c.method === method && c.url.includes(urlPattern)
            );
        },

        /**
         * Assert a call was made.
         */
        assertCalled(method, urlPattern, message) {
            const calls = this.findCalls(method, urlPattern);
            if (calls.length === 0) {
                throw new Error(message || `Expected ${method} ${urlPattern} to be called`);
            }
            return calls;
        },

        /**
         * Assert a call was NOT made.
         */
        assertNotCalled(method, urlPattern, message) {
            const calls = this.findCalls(method, urlPattern);
            if (calls.length > 0) {
                throw new Error(message || `Expected ${method} ${urlPattern} NOT to be called`);
            }
        }
    };

    // Install mock API functions
    window.App = {
        async apiGet(url) {
            MockBackend.log('GET', url);
            if (MockBackend.nextError) {
                const err = MockBackend.nextError;
                MockBackend.nextError = null;
                throw new Error(err);
            }
            await new Promise(r => setTimeout(r, MockBackend.latency));
            return { data: MockBackend.getResponse('GET', url) };
        },

        async apiPost(url, data) {
            MockBackend.log('POST', url, data);
            if (MockBackend.nextError) {
                const err = MockBackend.nextError;
                MockBackend.nextError = null;
                throw new Error(err);
            }
            await new Promise(r => setTimeout(r, MockBackend.latency));
            return { data: MockBackend.getResponse('POST', url, data) };
        },

        async apiPatch(url, data) {
            MockBackend.log('PATCH', url, data);
            if (MockBackend.nextError) {
                const err = MockBackend.nextError;
                MockBackend.nextError = null;
                throw new Error(err);
            }
            await new Promise(r => setTimeout(r, MockBackend.latency));
            return { data: MockBackend.getResponse('PATCH', url, data) };
        },

        async apiDelete(url) {
            MockBackend.log('DELETE', url);
            if (MockBackend.nextError) {
                const err = MockBackend.nextError;
                MockBackend.nextError = null;
                throw new Error(err);
            }
            await new Promise(r => setTimeout(r, MockBackend.latency));
            return { data: MockBackend.getResponse('DELETE', url) };
        }
    };

    // =========================================================================
    // TEST UTILITIES
    // =========================================================================

    /**
     * Create test face data.
     */
    function createFace(overrides = {}) {
        return {
            id: crypto.randomUUID(),
            image_id: 'img-' + Math.random().toString(36).slice(2, 8),
            image_timestamp: Date.now() - Math.random() * 1000000000,
            person_id: null,
            person_name: null,
            manually_tagged: false,
            suppressed: false,
            ...overrides
        };
    }

    /**
     * Create test person data.
     */
    function createPerson(name, overrides = {}) {
        return {
            id: crypto.randomUUID(),
            name,
            face_count: 0,
            preferred_face_id: null,
            threshold: null,
            ...overrides
        };
    }

    /**
     * Reset AppState caches for clean test.
     */
    function resetAppState() {
        // Access internal caches via the domains
        // We need to clear the faces and people caches
        if (AppState.faces._test) {
            AppState.faces._test.reset();
        }
        if (AppState.people._test) {
            AppState.people._test.reset();
        }
    }

    /**
     * Seed faces into the cache.
     */
    function seedFaces(faces) {
        if (AppState.faces._test) {
            for (const face of faces) {
                AppState.faces._test.addToCache(face);
            }
        }
    }

    /**
     * Seed people into the cache.
     */
    function seedPeople(people) {
        if (AppState.people._test) {
            for (const person of people) {
                AppState.people._test.addToCache(person);
            }
        }
    }

    /**
     * Assert helper.
     */
    function assert(condition, message) {
        if (!condition) {
            throw new Error(message || 'Assertion failed');
        }
    }

    /**
     * Assert equal helper.
     */
    function assertEqual(actual, expected, message) {
        if (actual !== expected) {
            throw new Error(`${message || 'Assertion failed'}: expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
        }
    }

    /**
     * Assert array length.
     */
    function assertLength(arr, expected, message) {
        if (arr.length !== expected) {
            throw new Error(`${message || 'Length mismatch'}: expected ${expected}, got ${arr.length}`);
        }
    }

    // =========================================================================
    // TEST DEFINITIONS
    // =========================================================================

    const tests = [];

    function describe(name, fn) {
        tests.push({ type: 'section', name });
        fn();
    }

    function test(name, fn) {
        tests.push({ type: 'test', name, fn });
    }

    // -------------------------------------------------------------------------
    // IDENTIFY TESTS
    // -------------------------------------------------------------------------

    describe('faces.identify() - Basic', () => {
        test('creates new person when name does not exist', async () => {
            MockBackend.reset();
            resetAppState();

            const face = createFace();
            seedFaces([face]);

            await AppState.faces.identify([face.id], 'Alice');

            // Person should be created
            const alice = AppState.people.getByName('Alice');
            assert(alice, 'Person Alice should exist');
            assertEqual(alice.face_count, 1, 'Face count');

            // Face should be linked and locked
            const updatedFace = AppState.faces.get(face.id);
            assertEqual(updatedFace.person_id, alice.id, 'Face person_id');
            assertEqual(updatedFace.person_name, 'Alice', 'Face person_name');
            assertEqual(updatedFace.manually_tagged, true, 'Face should be locked');

            // API calls
            MockBackend.assertCalled('POST', '/people', 'Should create person');
            MockBackend.assertCalled('POST', '/faces/assign', 'Should assign faces');
        });

        test('uses existing person when name matches', async () => {
            MockBackend.reset();
            resetAppState();

            const existingPerson = createPerson('Bob', { face_count: 1 });
            const existingFace = createFace({ person_id: existingPerson.id, person_name: 'Bob' });
            existingPerson.preferred_face_id = existingFace.id;

            const newFace = createFace();

            seedPeople([existingPerson]);
            seedFaces([existingFace, newFace]);

            await AppState.faces.identify([newFace.id], 'Bob');

            // Should NOT create new person
            MockBackend.assertNotCalled('POST', '/people', 'Should NOT create person');

            // Face count should increase
            const bob = AppState.people.get(existingPerson.id);
            assertEqual(bob.face_count, 2, 'Face count should be 2');

            // New face should be linked
            const updated = AppState.faces.get(newFace.id);
            assertEqual(updated.person_id, existingPerson.id, 'Face should link to Bob');
        });

        test('sets preferred face to newest when creating person', async () => {
            MockBackend.reset();
            resetAppState();

            const oldFace = createFace({ image_timestamp: 1000 });
            const newFace = createFace({ image_timestamp: 2000 });
            seedFaces([oldFace, newFace]);

            await AppState.faces.identify([oldFace.id, newFace.id], 'Charlie');

            const charlie = AppState.people.getByName('Charlie');
            assertEqual(charlie.preferred_face_id, newFace.id, 'Preferred should be newest face');
        });

        test('locks all identified faces', async () => {
            MockBackend.reset();
            resetAppState();

            const faces = [createFace(), createFace(), createFace()];
            seedFaces(faces);

            await AppState.faces.identify(faces.map(f => f.id), 'Dana');

            for (const face of faces) {
                const updated = AppState.faces.get(face.id);
                assertEqual(updated.manually_tagged, true, `Face ${face.id} should be locked`);
            }
        });
    });

    describe('faces.identify() - Edge Cases', () => {
        test('empty name delegates to unassign', async () => {
            MockBackend.reset();
            resetAppState();

            const person = createPerson('Eve', { face_count: 1 });
            const face = createFace({
                person_id: person.id,
                person_name: 'Eve',
                manually_tagged: true
            });
            person.preferred_face_id = face.id;

            seedPeople([person]);
            seedFaces([face]);

            await AppState.faces.identify([face.id], '');

            // Face should be unassigned
            const updated = AppState.faces.get(face.id);
            assertEqual(updated.person_id, null, 'Face should be unassigned');
            assertEqual(updated.manually_tagged, false, 'Face should be unlocked');

            // Person should be auto-deleted (0 faces)
            const eve = AppState.people.getByName('Eve');
            assert(!eve, 'Eve should be deleted (0 faces)');
        });

        test('whitespace-only name delegates to unassign', async () => {
            MockBackend.reset();
            resetAppState();

            const person = createPerson('Frank', { face_count: 1 });
            const face = createFace({ person_id: person.id, person_name: 'Frank' });
            person.preferred_face_id = face.id;

            seedPeople([person]);
            seedFaces([face]);

            await AppState.faces.identify([face.id], '   ');

            const updated = AppState.faces.get(face.id);
            assertEqual(updated.person_id, null, 'Face should be unassigned');
        });

        test('moves face from one person to another', async () => {
            MockBackend.reset();
            resetAppState();

            const grace = createPerson('Grace', { face_count: 2 });
            const henry = createPerson('Henry', { face_count: 1 });

            const face1 = createFace({ person_id: grace.id, person_name: 'Grace' });
            const face2 = createFace({ person_id: grace.id, person_name: 'Grace' });
            const face3 = createFace({ person_id: henry.id, person_name: 'Henry' });

            grace.preferred_face_id = face1.id;
            henry.preferred_face_id = face3.id;

            seedPeople([grace, henry]);
            seedFaces([face1, face2, face3]);

            // Move face2 from Grace to Henry
            await AppState.faces.identify([face2.id], 'Henry');

            // Grace should have 1 face
            const updatedGrace = AppState.people.get(grace.id);
            assertEqual(updatedGrace.face_count, 1, 'Grace face count');

            // Henry should have 2 faces
            const updatedHenry = AppState.people.get(henry.id);
            assertEqual(updatedHenry.face_count, 2, 'Henry face count');

            // Face should be linked to Henry
            const updated = AppState.faces.get(face2.id);
            assertEqual(updated.person_id, henry.id, 'Face should link to Henry');
        });

        test('auto-deletes old person when last face moved', async () => {
            MockBackend.reset();
            resetAppState();

            const ivan = createPerson('Ivan', { face_count: 1 });
            const jane = createPerson('Jane', { face_count: 1 });

            const face1 = createFace({ person_id: ivan.id, person_name: 'Ivan' });
            const face2 = createFace({ person_id: jane.id, person_name: 'Jane' });

            ivan.preferred_face_id = face1.id;
            jane.preferred_face_id = face2.id;

            seedPeople([ivan, jane]);
            seedFaces([face1, face2]);

            // Move Ivan's only face to Jane
            await AppState.faces.identify([face1.id], 'Jane');

            // Ivan should be auto-deleted
            const updatedIvan = AppState.people.get(ivan.id);
            assert(!updatedIvan, 'Ivan should be auto-deleted');

            // Jane should have 2 faces
            const updatedJane = AppState.people.get(jane.id);
            assertEqual(updatedJane.face_count, 2, 'Jane face count');
        });
    });

    // -------------------------------------------------------------------------
    // UNASSIGN TESTS
    // -------------------------------------------------------------------------

    describe('faces.unassign()', () => {
        test('returns face to unknown pool', async () => {
            MockBackend.reset();
            resetAppState();

            const kate = createPerson('Kate', { face_count: 2 });
            const face1 = createFace({ person_id: kate.id, person_name: 'Kate', manually_tagged: true });
            const face2 = createFace({ person_id: kate.id, person_name: 'Kate', manually_tagged: true });
            kate.preferred_face_id = face1.id;

            seedPeople([kate]);
            seedFaces([face1, face2]);

            await AppState.faces.unassign([face2.id]);

            // Face should be unassigned and unlocked
            const updated = AppState.faces.get(face2.id);
            assertEqual(updated.person_id, null, 'person_id should be null');
            assertEqual(updated.person_name, null, 'person_name should be null');
            assertEqual(updated.manually_tagged, false, 'Should be unlocked');

            // Kate should have 1 face
            const updatedKate = AppState.people.get(kate.id);
            assertEqual(updatedKate.face_count, 1, 'Kate face count');
        });

        test('auto-deletes person when all faces unassigned', async () => {
            MockBackend.reset();
            resetAppState();

            const leo = createPerson('Leo', { face_count: 2 });
            const face1 = createFace({ person_id: leo.id, person_name: 'Leo' });
            const face2 = createFace({ person_id: leo.id, person_name: 'Leo' });
            leo.preferred_face_id = face1.id;

            seedPeople([leo]);
            seedFaces([face1, face2]);

            await AppState.faces.unassign([face1.id, face2.id]);

            // Leo should be deleted
            const updatedLeo = AppState.people.get(leo.id);
            assert(!updatedLeo, 'Leo should be auto-deleted');
        });

        test('reassigns preferred when preferred face unassigned', async () => {
            MockBackend.reset();
            resetAppState();

            const maya = createPerson('Maya', { face_count: 2 });
            const oldFace = createFace({ person_id: maya.id, person_name: 'Maya', image_timestamp: 1000 });
            const newFace = createFace({ person_id: maya.id, person_name: 'Maya', image_timestamp: 2000 });
            maya.preferred_face_id = oldFace.id;

            seedPeople([maya]);
            seedFaces([oldFace, newFace]);

            // Unassign the preferred face
            await AppState.faces.unassign([oldFace.id]);

            // Preferred should switch to the remaining face
            const updatedMaya = AppState.people.get(maya.id);
            assertEqual(updatedMaya.preferred_face_id, newFace.id, 'Preferred should be newFace');
            assertEqual(updatedMaya.face_count, 1, 'Face count');
        });
    });

    // -------------------------------------------------------------------------
    // SUPPRESS TESTS
    // -------------------------------------------------------------------------

    describe('faces.suppress()', () => {
        test('marks face as suppressed', async () => {
            MockBackend.reset();
            resetAppState();

            const face = createFace();
            seedFaces([face]);

            await AppState.faces.suppress([face.id]);

            const updated = AppState.faces.get(face.id);
            assertEqual(updated.suppressed, true, 'Face should be suppressed');

            MockBackend.assertCalled('POST', '/faces/suppress');
        });

        test('unassigns identified face before suppressing', async () => {
            MockBackend.reset();
            resetAppState();

            const nina = createPerson('Nina', { face_count: 1 });
            const face = createFace({ person_id: nina.id, person_name: 'Nina' });
            nina.preferred_face_id = face.id;

            seedPeople([nina]);
            seedFaces([face]);

            await AppState.faces.suppress([face.id]);

            // Face should be suppressed and unassigned
            const updated = AppState.faces.get(face.id);
            assertEqual(updated.suppressed, true, 'Suppressed');
            assertEqual(updated.person_id, null, 'Unassigned');

            // Nina should be deleted (had only 1 face)
            const updatedNina = AppState.people.get(nina.id);
            assert(!updatedNina, 'Nina should be deleted');
        });
    });

    // -------------------------------------------------------------------------
    // LOCK/UNLOCK TESTS
    // -------------------------------------------------------------------------

    describe('faces.setLocked()', () => {
        test('locks faces', async () => {
            MockBackend.reset();
            resetAppState();

            const oscar = createPerson('Oscar', { face_count: 2 });
            const face1 = createFace({ person_id: oscar.id, person_name: 'Oscar', manually_tagged: false });
            const face2 = createFace({ person_id: oscar.id, person_name: 'Oscar', manually_tagged: false });
            oscar.preferred_face_id = face1.id;

            seedPeople([oscar]);
            seedFaces([face1, face2]);

            await AppState.faces.setLocked([face2.id], true);

            const updated = AppState.faces.get(face2.id);
            assertEqual(updated.manually_tagged, true, 'Should be locked');
        });

        test('unlocks non-preferred faces', async () => {
            MockBackend.reset();
            resetAppState();

            const paul = createPerson('Paul', { face_count: 2 });
            const face1 = createFace({ person_id: paul.id, person_name: 'Paul', manually_tagged: true });
            const face2 = createFace({ person_id: paul.id, person_name: 'Paul', manually_tagged: true });
            paul.preferred_face_id = face1.id;

            seedPeople([paul]);
            seedFaces([face1, face2]);

            await AppState.faces.setLocked([face2.id], false);

            const updated = AppState.faces.get(face2.id);
            assertEqual(updated.manually_tagged, false, 'Should be unlocked');
        });

        test('throws error when unlocking preferred face', async () => {
            MockBackend.reset();
            resetAppState();

            const quinn = createPerson('Quinn', { face_count: 1 });
            const face = createFace({ person_id: quinn.id, person_name: 'Quinn', manually_tagged: true });
            quinn.preferred_face_id = face.id;

            seedPeople([quinn]);
            seedFaces([face]);

            let error = null;
            try {
                await AppState.faces.setLocked([face.id], false);
            } catch (e) {
                error = e;
            }

            assert(error, 'Should throw error');
            assert(error.message.includes('preferred'), 'Error should mention preferred');

            // Face should still be locked
            const updated = AppState.faces.get(face.id);
            assertEqual(updated.manually_tagged, true, 'Should still be locked');
        });
    });

    // -------------------------------------------------------------------------
    // SET PREFERRED TESTS
    // -------------------------------------------------------------------------

    describe('people.setPreferred()', () => {
        test('sets preferred face', async () => {
            MockBackend.reset();
            resetAppState();

            const rachel = createPerson('Rachel', { face_count: 2 });
            const face1 = createFace({ person_id: rachel.id, person_name: 'Rachel' });
            const face2 = createFace({ person_id: rachel.id, person_name: 'Rachel' });
            rachel.preferred_face_id = face1.id;

            seedPeople([rachel]);
            seedFaces([face1, face2]);

            await AppState.people.setPreferredFace(rachel.id, face2.id);

            const updated = AppState.people.get(rachel.id);
            assertEqual(updated.preferred_face_id, face2.id, 'Preferred should be face2');
        });

        test('locks the preferred face', async () => {
            MockBackend.reset();
            resetAppState();

            const sam = createPerson('Sam', { face_count: 2 });
            const face1 = createFace({ person_id: sam.id, person_name: 'Sam', manually_tagged: true });
            const face2 = createFace({ person_id: sam.id, person_name: 'Sam', manually_tagged: false });
            sam.preferred_face_id = face1.id;

            seedPeople([sam]);
            seedFaces([face1, face2]);

            await AppState.people.setPreferredFace(sam.id, face2.id);

            // face2 should now be locked
            const updated = AppState.faces.get(face2.id);
            assertEqual(updated.manually_tagged, true, 'New preferred should be locked');
        });

        test('throws error for face not belonging to person', async () => {
            MockBackend.reset();
            resetAppState();

            const tom = createPerson('Tom', { face_count: 1 });
            const face1 = createFace({ person_id: tom.id, person_name: 'Tom' });
            const face2 = createFace(); // Not assigned to anyone
            tom.preferred_face_id = face1.id;

            seedPeople([tom]);
            seedFaces([face1, face2]);

            let error = null;
            try {
                await AppState.people.setPreferredFace(tom.id, face2.id);
            } catch (e) {
                error = e;
            }

            assert(error, 'Should throw error');
        });
    });

    // -------------------------------------------------------------------------
    // RENAME TESTS
    // -------------------------------------------------------------------------

    describe('people.rename() - Simple', () => {
        test('renames person', async () => {
            MockBackend.reset();
            resetAppState();

            const uma = createPerson('Uma', { face_count: 1 });

            const amy = createPerson('Amy', { face_count: 1 });

            zach.preferred_face_id = face1.id;
            amy.preferred_face_id = face3.id;

            seedFaces([face1, face2, face3]);

            await AppState.people.merge(zach.id, amy.id);

            // Zach deleted

            // Amy has 3 faces

            assertEqual(AppState.faces.get(face1.id).person_id, amy.id, 'Face1 -> Amy');
            assertEqual(AppState.faces.get(face2.id).person_id, amy.id, 'Face2 -> Amy');

        test('preserves locked status during merge', async () => {
            MockBackend.reset();
            resetAppState();

            const brian = createPerson('Brian', { face_count: 2 });
            const carol = createPerson('Carol', { face_count: 1 });
            const face1 = createFace({ person_id: brian.id, person_name: 'Brian', manually_tagged: true });
            const face2 = createFace({ person_id: brian.id, person_name: 'Brian', manually_tagged: false });
            const face3 = createFace({ person_id: carol.id, person_name: 'Carol' });
            brian.preferred_face_id = face1.id;
            carol.preferred_face_id = face3.id;

            seedFaces([face1, face2, face3]);

    // ROLLBACK TESTS
    // -------------------------------------------------------------------------

    describe('Error Handling & Rollback', () => {
        test('rolls back on API error', async () => {
            MockBackend.reset();
            resetAppState();

            const face = createFace();
            seedFaces([face]);

            // Set up API to fail
            MockBackend.nextError = 'Network error';

            let error = null;
            try {
                await AppState.faces.identify([face.id], 'FailPerson');
            } catch (e) {
                error = e;
            }

            assert(error, 'Should throw error');

            // Face should be rolled back (not assigned)
            const updated = AppState.faces.get(face.id);
            assertEqual(updated.person_id, null, 'Face should be rolled back');

            // Person should not exist
            const person = AppState.people.getByName('FailPerson');
            assert(!person, 'Person should not exist');
        });
    });

    // =========================================================================
    // TEST RUNNER
    // =========================================================================

    let results = { passed: 0, failed: 0, errors: [] };

    async function runAllTests() {
        results = { passed: 0, failed: 0, errors: [] };
        MockBackend.reset();
        document.getElementById('apiLog').innerHTML = '';
        document.getElementById('results').innerHTML = '';

        let html = '';
        let currentSection = null;

        for (const item of tests) {
            if (item.type === 'section') {
                if (currentSection !== null) {
                    html += '</div>';
                }
                html += `<h2>${item.name}</h2><div class="section">`;
                currentSection = item.name;
            } else {
                try {
                    MockBackend.reset();
                    resetAppState();
                    await item.fn();
                    results.passed++;
                    html += `<div class="test pass"><span class="icon">✓</span><span class="name">${item.name}</span></div>`;
                } catch (e) {
                    results.failed++;
                    results.errors.push({ test: item.name, error: e.message });
                    html += `<div class="test fail"><span class="icon">✗</span><span class="name">${item.name}<div class="error">${e.message}\n${e.stack}</div></span></div>`;
                }
            }
        }

        if (currentSection !== null) {
            html += '</div>';
        }

        document.getElementById('results').innerHTML = html;

        const total = results.passed + results.failed;
        const summaryEl = document.getElementById('summary');
        summaryEl.innerHTML = `
            <span class="pass">${results.passed} passed</span> /
            <span class="fail">${results.failed} failed</span> /
            ${total} total
        `;
    }

    function toggleApiLog() {
        document.getElementById('apiLog').classList.toggle('show');
    }
