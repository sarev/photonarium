# =============================================================================
# Photonarium Docker Compose
#
# Usage:
#   docker compose -f docker/docker-compose.yml up -d
#
# Or via Makefile:
#   make up      Start container
#   make down    Stop container
#   make logs    Follow logs
#
# For GPU acceleration, use an overlay file:
#   docker compose -f docker/docker-compose.yml -f docker/hwaccel.cuda.yml up -d
# =============================================================================

services:
  photonarium:
    container_name: photonarium
    image: photonarium:${PHOTONARIUM_TAG:-latest}
    restart: unless-stopped

    ports:
      - "${PHOTONARIUM_PORT:-5000}:5000"

    volumes:
      # Application data (database, thumbnails, config, models)
      # IMPORTANT: Must be on local storage, not NFS/SMB (SQLite requirement)
      - ${CONFIG_PATH:-./config}:/config

      # Catalogue for imported photos (organised by date)
      - ${CATALOGUE_PATH:-./catalogue}:/catalogue

      # Timezone sync for correct EXIF timestamp handling
      - /etc/localtime:/etc/localtime:ro

      # Photo libraries are mounted via docker-compose.photos.yml overlay
      # Example: docker compose -f docker/docker-compose.yml -f docker/docker-compose.photos.yml up -d

    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - PHOTONARIUM_PORT=${PHOTONARIUM_PORT:-5000}

    env_file:
      - path: .env
        required: false

    # Optional: register mounted photo folders on startup
    # Uncomment to auto-scan on container start:
    # command: --add-folder /photos/main --scan
