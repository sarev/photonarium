<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Getting Started with Photonarium</title>
<link rel="icon" type="image/png" sizes="90x90" href="./favicon90.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
<style>
/* ------------------------------------------------------------------ */
/* Reset & base                                                       */
/* ------------------------------------------------------------------ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Noto Sans', 'Segoe UI', system-ui, sans-serif;
    color: #fff;
}

/* ------------------------------------------------------------------ */
/* Slide layers (two alternating for cross-fade)                      */
/* ------------------------------------------------------------------ */
.slide {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
}
.slide.active {
    opacity: 1;
    pointer-events: auto;
}
.slide-img {
    flex: 1 1 0;
    min-height: 0;
    width: 100%;
    object-fit: contain;
    background: #000;
}

/* ------------------------------------------------------------------ */
/* Header bar (above the screenshot, in normal flow)                  */
/* ------------------------------------------------------------------ */
.slide-header {
    flex: 0 0 auto;
    background: #111;
    padding: 0.45rem 1.2rem;
    display: flex; justify-content: space-between; align-items: baseline;
    z-index: 2;
}
.slide-section {
    font-size: 0.8rem;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    letter-spacing: 0.05em;
}
.slide-step {
    font-size: 0.95rem;
    font-weight: 600;
    color: rgba(255,255,255,0.85);
}

/* ------------------------------------------------------------------ */
/* Caption overlay (bottom)                                           */
/* ------------------------------------------------------------------ */
.slide-overlay-bottom {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.78) 80%, rgba(0,0,0,0) 100%);
    padding: 2rem 1.5rem 2.2rem;
    max-height: 45vh;
    overflow-y: auto;
    z-index: 2;
}
.slide-caption {
    font-size: 0.95rem;
    line-height: 1.55;
    color: rgba(255,255,255,0.92);
}

/* Caption tables (toolbar overviews) */
.slide-caption table {
    width: 100%; border-collapse: collapse;
    margin-top: 0.6rem; font-size: 0.85rem;
}
.slide-caption th {
    text-align: left; padding: 0.3rem 0.6rem;
    border-bottom: 2px solid rgba(255,255,255,0.25);
    color: rgba(255,255,255,0.8);
}
.slide-caption td {
    padding: 0.25rem 0.6rem;
    border-bottom: 1px solid rgba(255,255,255,0.12);
    vertical-align: middle;
    color: rgba(255,255,255,0.85);
}
.slide-caption td.icon-cell {
    text-align: center; width: 4rem; font-size: 1.2rem;
}
.slide-caption .material-symbols-outlined {
    font-size: 1.2rem; vertical-align: middle;
}

/* ------------------------------------------------------------------ */
/* Progress bar                                                       */
/* ------------------------------------------------------------------ */
#progress-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 3px; background: rgba(255,255,255,0.15);
    z-index: 10;
}
#progress-fill {
    height: 100%; width: 0;
    background: rgba(255,255,255,0.6);
    transition: width 0.3s ease;
}

/* ------------------------------------------------------------------ */
/* Speech toggle                                                      */
/* ------------------------------------------------------------------ */
#speech-toggle {
    position: fixed; bottom: 0.35rem; right: 0.6rem;
    z-index: 20;
    background: rgba(0,0,0,0.5); border: none;
    color: #fff; font-size: 1.1rem;
    width: 1.8rem; height: 1.8rem;
    border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    opacity: 0.7; transition: opacity 0.2s;
}
#speech-toggle:hover { opacity: 1; }

/* ------------------------------------------------------------------ */
/* Slide counter                                                      */
/* ------------------------------------------------------------------ */
#slide-counter {
    position: fixed; bottom: 0.5rem; right: 3rem;
    z-index: 10;
    font-size: 0.75rem; color: rgba(255,255,255,0.45);
    font-variant-numeric: tabular-nums;
}

/* ------------------------------------------------------------------ */
/* Table of contents overlay                                          */
/* ------------------------------------------------------------------ */
#toc-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.93);
    z-index: 50;
    display: none;
    flex-direction: column;
    align-items: center; justify-content: center;
}
#toc-overlay.visible {
    display: flex;
}
#toc-overlay h2 {
    font-size: 1.6rem; margin-bottom: 1.5rem;
    background: linear-gradient(135deg, #9b59b6, #e056a0);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}
.toc-list {
    list-style: none; padding: 0; width: 90%; max-width: 520px;
}
.toc-list li {
    margin: 0.4rem 0;
}
.toc-list a {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 0.6rem 0.9rem;
    border-radius: 6px;
    color: rgba(255,255,255,0.8);
    text-decoration: none;
    transition: background 0.15s;
}
.toc-list a:hover {
    background: rgba(255,255,255,0.1);
    color: #fff;
}
.toc-range {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.4);
    margin-left: 1rem;
    white-space: nowrap;
}
.toc-help {
    margin-top: 2rem;
    font-size: 0.9rem;
    line-height: 1.7;
    color: rgba(255,255,255,0.6);
    text-align: center;
    max-width: 520px;
}
.toc-help kbd {
    display: inline-block;
    padding: 0.1em 0.45em;
    border: 1px solid rgba(155,89,182,0.5);
    border-radius: 3px;
    font-family: inherit;
    font-size: 0.85em;
    color: rgba(255,255,255,0.75);
}
</style>
</head>
<body>

<!-- Two alternating slide layers for cross-fade -->
<div id="slide-a" class="slide active">
    <div class="slide-header">
        <span class="slide-section"></span>
        <span class="slide-step"></span>
    </div>
    <img class="slide-img" alt="">
    <div class="slide-overlay-bottom">
        <div class="slide-caption"></div>
    </div>
</div>
<div id="slide-b" class="slide">
    <div class="slide-header">
        <span class="slide-section"></span>
        <span class="slide-step"></span>
    </div>
    <img class="slide-img" alt="">
    <div class="slide-overlay-bottom">
        <div class="slide-caption"></div>
    </div>
</div>

<!-- Progress bar -->
<div id="progress-bar"><div id="progress-fill"></div></div>

<!-- Speech toggle -->
<button id="speech-toggle" title="Toggle narration">&#x1f50a;</button>

<!-- Slide counter -->
<div id="slide-counter">1 / 78</div>

<!-- Table of contents overlay -->
<div id="toc-overlay">
    <h2>Getting Started with Photonarium</h2>
    <ul class="toc-list" id="toc-list"></ul>
    <div class="toc-help" id="toc-help-desktop">
        Click or press any key to advance &middot;
        <kbd>&larr;</kbd> go back &middot;
        <kbd>Esc</kbd> this menu<br>
        Click the speaker icon (bottom-right) to toggle narration
    </div>
    <div class="toc-help" id="toc-help-mobile" style="display:none">
        Swipe left to start &middot; Swipe right to go back<br>
        Swipe up to return here &middot; Tap the speaker icon for narration
    </div>
</div>

ned\">deselect</span></td><td>Clear selection</td></tr><tr><td class=\"icon-cell\">\ud83c\udf19</td><td class=\"icon-cell\"><span class=\"material-symbols-outlined\">dark_mode</span></td><td>Toggle light/dark theme</td></tr></table>", "screenshot": "screenshots/1-2.png"}, {"section": "Browsing your photos", "sectionNum": 1, "stepId": "1.3", "title": "Selecting a photo", "caption": "Click any thumbnail to select it. A border appears around the selected photo, and the info panel on the right shows its details.", "screenshot": "screenshots/1-3.png"}, {"section": "Browsing your photos", "sectionNum": 1, "stepId": "1.4", "title": "The info panel", "caption": "The info panel sits to the right of the thumbnail grid. It shows the filename, dimensions, date, and file size. You can also add a description and a rating to help you find this photo later. Use the toggle at its edge to collapse or expand it \u2014 handy when you want more room for thumbnails.", "screenshot": "screenshots/1-4.png"}, {"section": "Browsing your photos", "sectionNum": 1, "stepId": "1.5", "title": "Adding a description", "caption": "Type a description and press Enter to save it. Descriptions are searchable, so a few words now saves time later.", "screenshot": "screenshots/1-5.png"}, {"section": "Browsing your photos", "sectionNum": 1, "stepId": "1.6", "title": "Auto-captioning", "caption": "If you don't feel like typing, click the sparkle button to generate an automatic caption. You can edit it afterwards if you like.", "screenshot": "screenshots/1-6.png"}, {"section": "Browsing your photos", "sectionNum": 1, "stepId": "1.7", "title": "Emojis", "caption": "Click the emoji button next to the rating field to open the picker. Choose any emoji to rate your photo \u2014 stars, hearts, whatever might help you to find that image later.", "screenshot": "screenshots/1-7.png"}, {"section": "Browsing your photos", "sectionNum": 1, "stepId": "1.8", "title": "Ratings", "caption": "These can be any text you like. Emoji work well \u2014 try stars for favourites or hearts for the ones you love.", "screenshot": "screenshots/1-8.png"}, {"section": "Browsing your photos", "sectionNum": 1, "stepId": "1.9", "title": "Multiple selection", "caption": "Hold Shift and click to select a range. You can also Ctrl+click to pick individual photos, or drag a box around a group.", "screenshot": "screenshots/1-9.png"}, {"section": "Browsing your photos", "sectionNum": 1, "stepId": "1.10", "title": "Sort direction", "caption": "By default, photos are sorted by date. Click the arrow button to flip the current sort order.", "screenshot": "screenshots/1-10.png"}, {"section": "Browsing your photos", "sectionNum": 1, "stepId": "1.11", "title": "Sort direction", "caption": "Click again to go back to the original sort order. Use whichever direction suits what you\u2019re looking for.", "screenshot": "screenshots/1-11.png"}, {"section": "Browsing your photos", "sectionNum": 1, "stepId": "1.12", "title": "Similarity", "caption": "Select a single photo to use as the basis for similarity sorting. Then click to sort by similarity. The grid will be rearranged so photos that look the most like the selected image appear first.", "screenshot": "screenshots/1-12.png"}, {"section": "Browsing your photos", "sectionNum": 1, "stepId": "1.13", "title": "Similarity", "caption": "Here is an example of the Gallery sorted by image similarity.", "screenshot": "screenshots/1-13.png"}, {"section": "Full-screen viewer \u2014 Looking at photos up close", "sectionNum": 2, "stepId": "2.1", "title": "Opening", "caption": "Double-click any thumbnail to see it full-screen.", "screenshot": "screenshots/2-1.png"}, {"section": "Full-screen viewer \u2014 Looking at photos up close", "sectionNum": 2, "stepId": "2.2", "title": "Controls", "caption": "The full-screen toolbar appears at the top. Click the edges of the screen (or use arrow keys) to move between photos.<table><tr><th>Offline</th><th>Online</th><th>Description</th></tr><tr><t ere you can add the photo to existing groups or create new ones. If you have multiple photos selected, they\u2019ll all be added at once.", "screenshot": "screenshots/5-3.png"}, {"section": "Custom groups \u2014 Organising your photos", "sectionNum": 5, "stepId": "5.4", "title": "The Group Picker", "caption": "Clicking the badge opens the Group Picker. The left panel lists available groups; click one to add the photo (right panel shows current memberships). Photos can belong to multiple groups at once \u2014 just select as many as you like. Click Done to save or Cancel to discard.", "screenshot": "screenshots/5-4.png"}, {"section": "Custom groups \u2014 Organising your photos", "sectionNum": 5, "stepId": "5.5", "title": "Managing groups", "caption": "On the Custom level you can rename or delete groups using the toolbar buttons. When viewing a custom group in the Gallery, select photos and press Backspace to remove them from the group without deleting the photos themselves.", "screenshot": "screenshots/5-5.png"}, {"section": "Faces \u2014 Naming people", "sectionNum": 6, "stepId": "6.1", "title": "Opening", "caption": "Click the Faces button in the toolbar. This screen is where you name the people Photonarium has found in your photos.", "screenshot": "screenshots/6-1.png"}, {"section": "Faces \u2014 Naming people", "sectionNum": 6, "stepId": "6.2", "title": "Toolbar", "caption": "The Faces toolbar has its own controls.<table><tr><th>Offline</th><th>Online</th><th>Description</th></tr><tr><td class=\"icon-cell\">\u2500</td><td class=\"icon-cell\"><span class=\"material-symbols-outlined\">remove</span></td><td>Smaller face thumbnails</td></tr><tr><td class=\"icon-cell\">\u271a</td><td class=\"icon-cell\"><span class=\"material-symbols-outlined\">add</span></td><td>Larger face thumbnails</td></tr><tr><td class=\"icon-cell\">\u2754</td><td class=\"icon-cell\"><span class=\"material-symbols-outlined\">help</span></td><td>Show only unknown faces</td></tr><tr><td class=\"ic  {"section": "Fullscreen face tagging", "sectionNum": 7, "stepId": "7.1", "title": "Opening", "caption": "Let\u2019s find photos of someone we\u2019ve named. Click Search in the toolbar.", "screenshot": "screenshots/7-1.png"}, {"section": "Fullscreen face tagging", "sectionNum": 7, "stepId": "7.2", "title": "People picker", "caption": "In the People section, click Select people to choose who you want to filter by.", "screenshot": "screenshots/7-2.png"}, {"section": "Fullscreen face tagging", "sectionNum": 7, "stepId": "7.3", "title": "People picker", "caption": "Select people by clicking them, or drag them between the lists. You can pick as many as you like.", "screenshot": "screenshots/7-3.png"}, {"section": "Fullscreen face tagging", "sectionNum": 7, "stepId": "7.4", "title": "Applying the people filter", "caption": "Click Done, then Apply to see the results. The Gallery now shows only photos that contain Alice.", "screenshot": "screenshots/7-4.png"}, {"section": "Fullscreen face tagging", "sectionNum": 7, "stepId": "7.5", "title": "Full-screen", "caption": "Double-click a photo to open it full-screen. We know this one has Alice in it because of our filter.", "screenshot": "screenshots/7-5.png"}, {"section": "Fullscreen face tagging", "sectionNum": 7, "stepId": "7.6", "title": "Enabling face tagging mode", "caption": "Click the face icon (top left) to turn on face tagging. Coloured boxes appear around detected faces. Green means the face is named, red means it\u2019s unknown, grey means ignored, and orange appears when you\u2019re actively typing a name. Hover over a face to see the name.", "screenshot": "screenshots/7-6.png"}, {"section": "Fullscreen face tagging", "sectionNum": 7, "stepId": "7.7", "title": "Naming", "caption": "Click any face to type or change its name, right on the photo. Autocomplete suggestions appear as you type, and you have access to the sparkle button to access the Quick Match for a face, even if it has already been named or ignored.", "screenshot": "screenshots/7-7.png"}, {"section": "Fullscreen face tagging", "sectionNum": 7, "stepId": "7.8", "title": "Ignoring", "caption": "Hover over a face to see the same controls as the Faces screen. Click the grey minus to ignore, or the red X to remove a false detection. A green X will unname the face.", "screenshot": "screenshots/7-8.png"}, {"section": "Gallery extras", "sectionNum": 8, "stepId": "8.1", "title": "Sorting by people", "caption": "This groups your photos by who\u2019s in them. Photos of the same person appear together.", "screenshot": "screenshots/8-1.png"}, {"section": "Gallery extras", "sectionNum": 8, "stepId": "8.2", "title": "Switching themes", "caption": "Click the moon/sun icon to switch between light and dark themes.", "screenshot": "screenshots/8-2.png"}, {"section": "Gallery extras", "sectionNum": 8, "stepId": "8.3", "title": "Larger thumbnails", "caption": "Click the Larger thumbnails button to make the grid bigger. Each photo shows more detail.", "screenshot": "screenshots/8-3.png"}, {"section": "Gallery extras", "sectionNum": 8, "stepId": "8.4", "title": "Smaller thumbnails", "caption": "Click the Smaller thumbnails button to shrink them back down. You can see more photos at once this way.", "screenshot": "screenshots/8-4.png"}, {"section": "Use it anywhere in your home", "sectionNum": 9, "stepId": "9.1", "title": "Mobile \u2014 landscape", "caption": "Photonarium works on phones and tablets too. In landscape, the layout adjusts to give you a thumbnail grid and info panel side by side, with a compact toolbar that collapses into a hamburger menu.", "screenshot": "manual/mobile-landscape.png"}, {"section": "Use it anywhere in your home", "sectionNum": 9, "stepId": "9.2", "title": "Mobile \u2014 portrait", "caption": "In portrait, the info panel stacks below the grid and scrollbars widen for touch. It\u2019s great for browsing on the sofa or checking your library from another room. Multiple devices can use Photonarium at the same time \u2014 changes you make on one (naming a face, rating a photo, creating a group) appear on every other device within seconds, so everything stays in sync.", "screenshot": "manual/mobile-portrait.png"}];
    const TOC    = [{"title": "Getting started \u2014 Adding your first photos", "first": 0, "range": "0.1 \u2013 0.5"}, {"title": "Browsing your photos", "first": 5, "range": "1.1 \u2013 1.13"}, {"title": "Full-screen viewer \u2014 Looking at photos up close", "first": 18, "range": "2.1 \u2013 2.5"}, {"title": "Search \u2014 Finding specific photos", "first": 23, "range": "3.1 \u2013 3.8"}, {"title": "Groups \u2014 Finding duplicates", "first": 31, "range": "4.1 \u2013 4.8"}, {"title": "Custom groups \u2014 Organising your photos", "first": 39, "range": "5.1 \u2013 5.5"}, {"title": "Faces \u2014 Naming people", "first": 44, "range": "6.1 \u2013 6.20"}, {"title": "Fullscreen face tagging", "first": 64, "range": "7.1 \u2013 7.8"}, {"title": "Gallery extras", "first": 72, "range": "8.1 \u2013 8.4"}, {"title": "Use it anywhere in your home", "first": 76, "range": "9.1 \u2013 9.2"}];
    const TOTAL  = SLIDES.length;

    /* -- DOM refs --------------------------------------------------- */
    const layerA       = document.getElementById('slide-a');
    const layerB       = document.getElementById('slide-b');
    const progressFill = document.getElementById('progress-fill');
    const counter      = document.getElementById('slide-counter');
    const speechBtn    = document.getElementById('speech-toggle');
    const tocOverlay   = document.getElementById('toc-overlay');
    const tocList      = document.getElementById('toc-list');

    /* -- State ------------------------------------------------------ */
    let currentIndex = 0;
    let activeLayer  = layerA;   // the layer currently visible
    let speechOn     = localStorage.getItem('tutorial-speech') !== 'off';

    /* -- TOC -------------------------------------------------------- */
    TOC.forEach(function (entry) {
        const li = document.createElement('li');
        const a  = document.createElement('a');
        a.href = '#';
        a.innerHTML = entry.title +
            '<span class="toc-range">' + entry.range + '</span>';
        a.addEventListener('click', function (e) {
            e.preventDefault();
            hideToc();
            goTo(entry.first);
        });
        li.appendChild(a);
        tocList.appendChild(li);
    });

    function showToc() { tocOverlay.classList.add('visible'); }
    function hideToc() { tocOverlay.classList.remove('visible'); }
    function tocVisible() { return tocOverlay.classList.contains('visible'); }

    /* -- Populate a layer ------------------------------------------- */
    function populate(layer, idx) {
        const s = SLIDES[idx];
        layer.querySelector('.slide-section').textContent = 'Photonarium: ' + s.section;
        layer.querySelector('.slide-step').textContent    = s.stepId + '. ' + s.title;
        layer.querySelector('.slide-img').src             = s.screenshot;
        layer.querySelector('.slide-img').alt             = s.title;
        layer.querySelector('.slide-caption').innerHTML    = s.caption;
    }

    /* -- Cross-fade ------------------------------------------------- */
    function swapTo(idx) {
        if (idx < 0 || idx >= TOTAL) return;
        currentIndex = idx;

        const inactiveLayer = (activeLayer === layerA) ? layerB : layerA;
        populate(inactiveLayer, idx);

        // Swap active class — CSS transition handles the cross-fade
        activeLayer.classList.remove('active');
        inactiveLayer.classList.add('active');
        activeLayer = inactiveLayer;

        updateChrome();
        speak(idx);
        preload(idx + 1);
    }

    /* -- Chrome updates --------------------------------------------- */
    function updateChrome() {
        const pct = ((currentIndex + 1) / TOTAL) * 100;
        progressFill.style.width = pct + '%';
        counter.textContent = (currentIndex + 1) + ' / ' + TOTAL;
    }

    /* -- Image preloading ------------------------------------------- */
    function preload(idx) {
        if (idx >= 0 && idx < TOTAL) {
            const img = new Image();
            img.src = SLIDES[idx].screenshot;
        }
    }

    /* -- Navigation ------------------------------------------------- */
    function next() {
        if (currentIndex < TOTAL - 1) {
            swapTo(currentIndex + 1);
        } else {
            showToc();
        }
    }

    function prev() {
        if (currentIndex > 0) {
            swapTo(currentIndex - 1);
        }
    }

    function goTo(idx) {
        if (idx >= 0 && idx < TOTAL) {
            swapTo(idx);
        }
    }

    /* -- TTS -------------------------------------------------------- */
    const synth = window.speechSynthesis;
    let chosenVoice = null;

    /** Pick the best available English voice. */
    function pickVoice() {
        const voices = synth.getVoices();
        if (!voices.length) return;

        // Priority 1: en-GB "Female" or known neural names
        const neural = ['Google UK English Female', 'Microsoft Libby Online',
                        'Libby', 'Sonia'];
        chosenVoice = voices.find(function (v) {
            return v.lang.startsWith('en-GB')
                && neural.some(function (n) { return v.name.indexOf(n) !== -1; });
        }) || null;

        // Priority 2: any en-GB with "Female" in the name
        if (!chosenVoice) {
            chosenVoice = voices.find(function (v) {
                return v.lang.startsWith('en-GB') && v.name.indexOf('Female') !== -1;
            }) || null;
        }

        // Priority 3: any en-GB voice
        if (!chosenVoice) {
            chosenVoice = voices.find(function (v) {
                return v.lang.startsWith('en-GB');
            }) || null;
        }

        // Priority 4: any English voice
        if (!chosenVoice) {
            chosenVoice = voices.find(function (v) {
                return v.lang.startsWith('en');
            }) || null;
        }
    }

    // Voices load asynchronously in some browsers
    if (synth) {
        pickVoice();
        if (synth.onvoiceschanged !== undefined) {
            synth.onvoiceschanged = pickVoice;
        }
    }

    /**
     * Strip HTML to plain text for TTS narration.
     * Removes <table> blocks entirely (toolbar overviews contain unicode
     * symbols and Material Symbol ligature names that sound garbled when
     * read aloud) and then extracts the remaining text content.
     */
    function stripHtml(html) {
        var tmp = document.createElement('div');
        tmp.innerHTML = html;
        // Remove tables — they're visual reference, not narration
        tmp.querySelectorAll('table').forEach(function (t) { t.remove(); });
        // Remove Material Symbol spans (ligature text like "rotate_left")
        tmp.querySelectorAll('.material-symbols-outlined').forEach(
            function (el) { el.remove(); });
        return (tmp.textContent || tmp.innerText || '').replace(/\s+/g, ' ').trim();
    }

    /** Speak the current slide's content. */
    function speak(idx) {
        if (!synth || !speechOn) return;
        synth.cancel();

        var parts = [];
        var s = SLIDES[idx];
        var prev = idx > 0 ? SLIDES[idx - 1] : null;

        // Announce section title if it changed
        if (!prev || prev.section !== s.section) {
            parts.push(s.section + '.');
        }
        // Announce step title if it changed
        if (!prev || prev.title !== s.title) {
            parts.push(s.title + '.');
        }
        // Always speak the caption
        parts.push(stripHtml(s.caption));

        var text = parts.join(' ');
        if (!text) return;

        var utter = new SpeechSynthesisUtterance(text);
        utter.rate  = 1.15;
        utter.pitch = 1.0;
        if (chosenVoice) utter.voice = chosenVoice;
        synth.speak(utter);
    }

    /* -- Speech toggle ---------------------------------------------- */
    function updateSpeechBtn() {
        speechBtn.textContent = speechOn ? '\u{1f50a}' : '\u{1f507}';
    }
    updateSpeechBtn();

    speechBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        speechOn = !speechOn;
        localStorage.setItem('tutorial-speech', speechOn ? 'on' : 'off');
        updateSpeechBtn();
        if (speechOn) {
            speak(currentIndex);  // Narrate the current slide immediately
        } else if (synth) {
            synth.cancel();
        }
    });

    /* -- Keyboard --------------------------------------------------- */
    document.addEventListener('keydown', function (e) {
        // If TOC is visible, handle differently
        if (tocVisible()) {
            if (e.key === 'Escape') {
                // Navigate back to the landing page
                window.location.href = '../index.html?getting-started';
            } else {
                hideToc();
                speak(currentIndex);
            }
            return;
        }

        switch (e.key) {
            case 'ArrowLeft':
                prev();
                break;
            case 'ArrowRight':
            case ' ':
                e.preventDefault();
                next();
                break;
            case 'Escape':
                showToc();
                break;
            default:
                // Any other key advances (ignore modifiers/function keys)
                if (e.key.length === 1 || e.key === 'Enter') {
                    next();
                }
                break;
        }
    });

    /* -- Click navigation (click anywhere to advance) --------------- */
    document.addEventListener('click', function (e) {
        // Ignore clicks on controls
        if (e.target.closest('#speech-toggle, #toc-overlay')) return;
        next();
    });

    /* -- Swipe navigation (touch devices) ----------------------------- */
    var touchStartX = null;
    var touchStartY = null;

    document.addEventListener('touchstart', function (e) {
        var touch = e.touches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
    }, { passive: true });

    document.addEventListener('touchend', function (e) {
        if (touchStartX === null) return;
        var touch = e.changedTouches[0];
        var dx = touch.clientX - touchStartX;
        var dy = touch.clientY - touchStartY;
        touchStartX = null;
        touchStartY = null;

        // Ignore short swipes
        var absDx = Math.abs(dx);
        var absDy = Math.abs(dy);
        if (absDx < 50 && absDy < 50) return;

        // Swipe up — return to menu (or to main site from menu)
        if (absDy > absDx && dy < 0) {
            if (tocVisible()) {
                window.location.href = '../index.html?getting-started';
            } else {
                showToc();
            }
            return;
        }

        // Ignore mostly-vertical swipes for left/right handling
        if (absDy > absDx) return;

        if (dx < 0) {
            // Swipe left — advance
            if (tocVisible()) {
                hideToc();
                goTo(0);
                speak(0);
            } else {
                next();
            }
        } else {
            // Swipe right — go back
            if (tocVisible()) {
                window.location.href = '../index.html?getting-started';
            } else if (currentIndex === 0) {
                showToc();
            } else {
                prev();
            }
        }
    });

    /* -- Initial render --------------------------------------------- */
    populate(activeLayer, 0);
    updateChrome();
    preload(1);

    // Show touch-oriented help text on mobile devices
    var isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    if (isMobile) {
        document.getElementById('toc-help-desktop').style.display = 'none';
        document.getElementById('toc-help-mobile').style.display = '';
    }

    // Start on the table of contents so the user can see the overview
    // and navigation help before the slideshow begins
    showToc();
})();
</script>
</body>
</html>
